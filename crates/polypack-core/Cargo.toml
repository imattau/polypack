[package]
name = "polypack-core"
description = "Portable embedded property-graph and vector-search core for polypack"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "polypack_core"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
rmp-serde = "1"
rmpv = { version = "1", features = ["serde"] }

[dev-dependencies]
