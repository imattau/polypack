[package]
name = "polypack-graph"
description = "Stateful property-graph orchestration (hot cache, edge index, vector search, persistence) built on polypack-core"
version.workspace = true
edition.workspace = true
license.workspace = true
readme = "README.md"
repository = "https://github.com/imattau/polypack"
keywords = ["graph", "vector-search", "hnsw", "persistence", "embedded"]
categories = ["data-structures", "algorithms", "database"]

[lib]
name = "polypack_graph"

[dependencies]
polypack-core = { path = "../polypack-core", version = "3.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }

[dev-dependencies]
