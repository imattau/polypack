[package]
name = "polypack-node"
description = "NAPI-RS bindings exposing polypack-core to Node.js"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "2", default-features = false, features = ["napi8"] }
napi-derive = "2"
polypack-core = { path = "../polypack-core" }
