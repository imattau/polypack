[package]
name = "polypack-python"
description = "PyO3 bindings exposing polypack-core to Python"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "polypack_python"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.24", features = ["abi3-py38"] }
numpy = "0.24"
polypack-core = { path = "../polypack-core" }
