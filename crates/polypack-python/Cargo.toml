[package]
name = "polypack-python"
description = "PyO3 bindings exposing polypack-core to Python"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "polypack_python"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.24", features = ["abi3-py38", "serde"] }
numpy = "0.24"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
polypack-core = { path = "../polypack-core" }
