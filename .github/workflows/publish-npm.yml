name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out release
        uses: actions/checkout@v6

      - name: Set up Node.js and npm registry
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false

      - name: Verify release tag matches package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: >-
          node --input-type=module --eval
          "const { default: pkg } = await import('./package.json', { with: { type: 'json' } });
          const expected = 'v' + pkg.version;
          if (process.env.RELEASE_TAG !== expected) {
            console.error('Release tag ' + process.env.RELEASE_TAG + ' does not match ' + expected);
            process.exit(1);
          }"

      - name: Install dependencies
        run: npm ci

      - name: Test, build, and verify exports
        run: npm run check

      - name: Inspect package contents
        run: npm pack --dry-run

      - name: Publish public package
        run: npm publish --access public
