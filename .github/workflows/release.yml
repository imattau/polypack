name: Release

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  release-candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm run check
      - run: cargo test --release --manifest-path crates/Cargo.toml
      - run: cargo clippy --all-targets --manifest-path crates/Cargo.toml -- -D warnings
      - name: Python tests against the built wheel
        shell: bash
        env:
          POLYPACK_FIXTURES: ${{ github.workspace }}/fixtures/conformance
        run: |
          pip install maturin numpy pytest
          maturin build --release --out dist
          pip install dist/*.whl
          WS="${GITHUB_WORKSPACE//\\//}"
          TMP="${RUNNER_TEMP//\\//}"
          cd "$TMP"
          python -m pytest "$WS/python/tests" -q
        working-directory: python

  ts-publish:
    needs: release-candidate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/
          cache: npm
      - name: Verify release tag matches package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          node --input-type=module --eval "const pkg = (await import('./package.json', { with: { type: 'json' } })).default; const expected = 'v' + pkg.version; if (process.env.RELEASE_TAG !== expected) { console.error('Release tag ' + process.env.RELEASE_TAG + ' does not match ' + expected); process.exit(1) }"
      - run: npm ci
      - name: Publish TypeScript package
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "@0xx0lostcause0xx0/polypack@$VERSION" version >/dev/null 2>&1; then
            echo "skip @0xx0lostcause0xx0/polypack@$VERSION (already published)"
          else
            npm publish --access public --provenance
          fi

  native-publish:
    needs: release-candidate
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            triple: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            triple: aarch64-unknown-linux-gnu
          # macos-13 (Intel-hosted) runners have been chronically stuck
          # queued for many hours on GitHub's shared pool; cross-compile
          # darwin-x64 from the arm64 macos-14 runner instead (Xcode's
          # linker handles this pair natively — no extra SDK needed).
          - os: macos-14
            triple: x86_64-apple-darwin
          - os: macos-14
            triple: aarch64-apple-darwin
          - os: windows-latest
            triple: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org/
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.triple }}
      - run: npm ci
      - name: Build native addon for ${{ matrix.triple }}
        # Not `npm run build:binary -- --target ...`: build:binary is a
        # compound `napi build && rm ...` script, and npm would append the
        # extra args to the end of that whole string (onto `rm`), not onto
        # `napi build`. Invoke napi directly instead.
        # shell: bash — windows-latest defaults to PowerShell, which doesn't
        # understand the `\` line-continuation used below.
        shell: bash
        run: |
          npx napi build --platform --release \
            --manifest-path ../../crates/polypack-node/Cargo.toml \
            --output-dir dist --no-js --target ${{ matrix.triple }}
          rm -f dist/index.d.ts
        working-directory: packages/node-native
      - name: Upload addon
        uses: actions/upload-artifact@v4
        with:
          name: release-addon-${{ matrix.triple }}
          path: packages/node-native/dist/polypack-native.*.node
          if-no-files-found: error

  native-package-publish:
    needs: native-publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org/
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          pattern: release-addon-*
          merge-multiple: true
      - name: Stage addons and publish platform packages
        run: |
          set -e
          npm run build:js --prefix packages/node-native
          cd packages/node-native
          npx napi create-npm-dirs
          for f in "$GITHUB_WORKSPACE"/polypack-native.*.node; do
            [ -e "$f" ] || continue
            case "$(basename "$f")" in
              *linux-x64-gnu.node)   d=npm/linux-x64-gnu ;;
              *linux-arm64-gnu.node) d=npm/linux-arm64-gnu ;;
              *darwin-x64.node)      d=npm/darwin-x64 ;;
              *darwin-arm64.node)    d=npm/darwin-arm64 ;;
              *win32-x64-msvc.node)  d=npm/win32-x64-msvc ;;
              *) continue ;;
            esac
            cp "$f" "$d/"
          done
          VERSION=$(node -p "require('./package.json').version")
          publish_if_missing() {
            local name="$1" dir="$2"
            if npm view "$name@$VERSION" version >/dev/null 2>&1; then
              echo "  skip $name@$VERSION (already published)"
            else
              (cd "$dir" && npm publish --provenance --access public)
            fi
          }
          for pkg in npm/*/; do
            name=$(node -p "require('./$pkg/package.json').name")
            publish_if_missing "$name" "$pkg"
          done
          publish_if_missing "$(node -p "require('./package.json').name")" .

  crate-publish:
    needs: release-candidate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Fetch crates.io OIDC token
        id: oidc
        run: |
          token=$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=crates.io" | jq -r .value)
          test -n "$token" || { echo "OIDC token fetch failed"; exit 1; }
          echo "oidc_token=$token" >> "$GITHUB_OUTPUT"
      - name: Publish polypack-core to crates.io
        env:
          # Prefer a classic CRATES_IO_TOKEN secret if set; otherwise use the
          # OIDC token (crates.io trusted publishing for this workflow).
          CARGO_REGISTRIES_CRATES_IO_TOKEN: ${{ secrets.CRATES_IO_TOKEN || steps.oidc.outputs.oidc_token }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN || steps.oidc.outputs.oidc_token }}
        run: |
          set -euo pipefail
          # Note: working-directory is already `crates`, so this path must
          # not be re-prefixed with `crates/` (that silently produced an
          # empty $VERSION here before, which made the "already published"
          # check pass right through to a failing `cargo publish`).
          VERSION=$(cargo metadata --no-deps --format-version 1 --manifest-path polypack-core/Cargo.toml | jq -r '.packages[0].version')
          test -n "$VERSION" && [ "$VERSION" != "null" ]
          if curl -sf -A "polypack-release" "https://crates.io/api/v1/crates/polypack-core/$VERSION" >/dev/null 2>&1; then
            echo "skip polypack-core@$VERSION (already published)"
          else
            cargo publish -p polypack-core
          fi
        working-directory: crates

  wheel-publish:
    needs: release-candidate
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - name: Install maturin
        run: pip install maturin
      - name: Build wheel
        run: maturin build --release --out dist
        working-directory: python
      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: release-wheel-${{ runner.os }}
          path: python/dist/*.whl
          if-no-files-found: error

  wheel-publish-upload:
    needs: wheel-publish
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-wheel-*
          merge-multiple: true
      - name: Collect wheels
        run: |
          mkdir -p dist
          mv "$GITHUB_WORKSPACE"/*.whl dist/
      - name: Publish wheels to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # allow re-running a release without failing on already-uploaded files
          skip-existing: true
