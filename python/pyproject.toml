[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "polypack-db"
version = "2.4.7"
description = "Embedded local-first property graph with vector search"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
dependencies = ["numpy>=1.20"]

[project.urls]
Repository = "https://github.com/imattau/polypack"

[tool.maturin]
python-source = "."
module-name = "polypack._core"
manifest-path = "../crates/polypack-python/Cargo.toml"
features = ["pyo3/extension-module"]
# bench.py/conformance.py are repo-relative dev tooling (they read fixtures
# from ../tests/conformance and ../benchmarks, which don't exist post-install)
# — keep them importable for local dev (`maturin develop`) but never ship
# them, or any bytecode cache, in the published wheel/sdist.
exclude = [
    "polypack/bench.py",
    "polypack/conformance.py",
    "**/__pycache__/**",
    "**/*.pyc",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
