[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "polypack-db"
version = "3.4.0"
description = "Embedded local-first property graph with vector search"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
dependencies = ["numpy>=1.20"]

[project.urls]
Repository = "https://github.com/imattau/polypack"

[tool.maturin]
python-source = "."
module-name = "polypack._core"
manifest-path = "../crates/polypack-python/Cargo.toml"
features = ["pyo3/extension-module"]
# CI builds a real (non-editable) wheel and runs the full pytest suite
# against it — including test_conformance.py (imports polypack.conformance)
# and examples/100k.py (imports polypack.bench) — so those two modules must
# stay in the built wheel. Only exclude genuine build-environment leakage.
exclude = [
    "**/__pycache__/**",
    "**/*.pyc",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
